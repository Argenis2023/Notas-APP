<!doctype html>
<html lang="es-VE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cuaderno docente</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.bigdatacloud.net; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="description" content="Cuaderno de evaluación para docentes: estudiantes, listas de cotejo y reportes.">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<noscript><p style="padding:1rem">El Cuaderno docente necesita JavaScript para funcionar.</p></noscript>

<div id="gate" hidden></div>

<div id="shell" hidden>
  <header class="top">
    <img id="top-logo" class="top-logo" alt="" hidden>
    <div class="top-texto">
      <div class="top-fila"><h1 id="titulo">Hoy</h1><button id="clima" class="clima-chip" type="button" aria-haspopup="dialog" hidden></button></div>
      <div class="top-sub">
        <p id="top-inst" class="top-inst" hidden></p>
        <button id="chip" class="chip local" type="button"><span class="punto" aria-hidden="true"></span><span id="chip-texto">Solo en este celular</span></button>
      </div>
    </div>
    <div class="top-acciones" id="top-acciones">
      <a id="campana" class="campana top-btn" href="#/avisos" hidden aria-label="Avisos"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span id="campana-n" class="campana-n"></span></a>
      <button id="rapido" class="top-btn top-mas" type="button" aria-label="Crear o anotar algo nuevo" aria-haspopup="true" aria-expanded="false" aria-controls="rapido-menu"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="rapido-menu" class="rapido" hidden>
      <p class="rapido-t">Nuevo</p>
      <a class="rapido-i" id="rapido-lista" href="#/asistencia">Asistencia de hoy</a>
      <a class="rapido-i" href="#/anotaciones">Anotar algo de un estudiante</a>
      <a class="rapido-i" href="#/evaluar">Evaluar</a>
      <a class="rapido-i" href="#/agenda">Agenda</a>
      <a class="rapido-i" href="#/estudiantes/nuevo">Agregar un estudiante</a>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Secciones del cuaderno">
    <span class="tabs-pildora" aria-hidden="true"></span>
    <a href="#/" data-ruta="inicio"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Hoy</span></a>
    <a href="#/estudiantes" data-ruta="curso"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c.4-3.4 3-5.3 6-5.3s5.6 1.9 6 5.3"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6"/><path d="M18 14.6c1.8.7 2.9 2.3 3.1 4.4"/></svg><span>Curso</span></a>
    <a href="#/evaluar" data-ruta="evaluar"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l3 3v14H6z"/><path d="m9 13 2 2 4-4.5"/><path d="M9 8h4"/></svg><span>Evaluar</span></a>
    <a href="#/reportes" data-ruta="reportes"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 20v-7"/><path d="M12 20V5"/><path d="M17 20v-10"/></svg><span>Reportes</span></a>
    <a href="#/mas" data-ruta="mas"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01" stroke-width="3.2"/></svg><span>Más</span></a>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
